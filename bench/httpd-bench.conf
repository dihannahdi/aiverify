# Isolated Apache instance for functional tests and overhead measurement. Same binary and modules as
# production, separate config, bound to loopback only. The access log keeps only %D (server-side time in
# microseconds) and the status, which every condition pays equally.
ServerRoot "/www/server/apache"
Listen 127.0.0.1:18089
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule remoteip_module modules/mod_remoteip.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule log_config_module modules/mod_log_config.so
User www
Group www
ServerName bench.local
PidFile /opt/aiverify/bench/run/httpd.pid
ErrorLog /opt/aiverify/bench/run/error.log
LogLevel warn
LogFormat "%D %>s" bench
CustomLog /opt/aiverify/bench/run/access.log bench
StartServers 2
ThreadsPerChild 25
MaxRequestWorkers 100
KeepAlive On
DocumentRoot "/opt/aiverify/bench/htdocs"
<Directory "/opt/aiverify/bench/htdocs">
    Require all granted
</Directory>
# A stricter rule the enforcement block must not loosen (AuthMerging And).
<Files ".env">
    Require all denied
</Files>
# The benchmark client sets the client address it wants to simulate.
RemoteIPHeader X-Bench-IP
RemoteIPInternalProxy 127.0.0.1
IncludeOptional /opt/aiverify/bench/rules/*.conf
